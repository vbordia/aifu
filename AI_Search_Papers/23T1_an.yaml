questions:
- id: 1
  type: short_answer
  label: SEARCH
  question: |
    A MoveGen for a state space where S is the start node and G is the goal node is shown in the table. The MoveGen function returns nodes in the order as shown in the table. Use DFS and BFS to find a path from S to G. Note: DFS and BFS inspect only new nodes.

    | X | MoveGen(X) |
    |---|---|
    | S | [A, C] |
    | A | [B, C, D, S] |
    | B | [A, D, E] |
    | C | [A, D, S] |
    | D | [A, B, C, E, G] |
    | E | [B, D, G] |
    | G | [D, E] |

    What is the path found by DFS? Enter the path as a comma separated list.

    NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
    Answer format: S,X,Y,Z
  correct_answer: S,A,B,E,G
- id: 2
  type: comprehension
  label: TSP BnB
  description: |
    TSP BnB algorithm is solving a TSP instance where the cities are A, B, C, .... and so on. The BnB search tree (at the point when the algorithm discovers the optimal tour) is provided below.

    Each node in the search tree displays an edge (either XY or $\neg$XY), a cost value, and a unique reference number (a1, b1, ..., c1, ..., d1, ..., e1, ..., f1, f2). Use the reference numbers to break ties. When required, use reference numbers in short answers.

    ```mermaid
    graph TD
        a1["a1<br/>S0<br/>424"] --> b1["b1<br/>BF<br/>424"]
        a1 --> b2["b2<br/>¬BF<br/>459"]
        b1 --> c1["c1<br/>DF<br/>449"]
        b1 --> c2["c2<br/>¬DF<br/>437"]
        c1 --> d1["d1<br/>CE<br/>449"]
        c1 --> d2["d2<br/>¬CE<br/>501"]
        c2 --> d3["d3<br/>EF<br/>440"]
        c2 --> d4["d4<br/>¬EF<br/>456"]
        d1 --> e1["e1<br/>AC<br/>460"]
        d1 --> e2["e2<br/>¬AC<br/>508"]
        d3 --> e3["e3<br/>CE<br/>496"]
        d3 --> e4["e4<br/>¬CE<br/>490"]
        d4 --> e5["e5<br/>CE<br/>456"]
        d4 --> e6["e6<br/>¬CE<br/>488"]
        e5 --> f1["f1<br/>AC<br/>456"]
        e5 --> f2["f2<br/>¬AC<br/>484"]
    ```

    What information can you glean from the search tree? Answer the sub-questions based on the information gleaned from the search tree.
  subquestions:
  - sub_id: '2.1'
    question_type: short_answer
    question: |
      Determine the number of cities in the TSP instance. Enter the number of cities in the text box, or enter NIL if it is not possible to determine the number of cities.

      Enter an integer.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '6'
  - sub_id: '2.2'
    question_type: short_answer
    question: |
      Let S0 (ref. no. a1) be the first node to be refined, identify the next 4 nodes (2nd to 5th node) that are refined by the TSP BnB algorithm. Enter the nodes (node reference numbers) in the order they are refined.

      Enter a comma separated list of node reference numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: a9,b9,c9,d9
    correct_answer: b1,c2,d3,c1
  - sub_id: '2.3'
    question_type: short_answer
    question: |
      Which node represents the optimal tour? Enter the node reference number in the text box, or enter NIL if it is not possible to determine the optimal tour.

      Enter a node reference number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: a9
    correct_answer: f1
  - sub_id: '2.4'
    question_type: short_answer
    question: |
      What is the cost of the optimal tour? Enter the cost of the optimal tour in the text box, or enter NIL if it is not possible to determine the optimal tour.

      Enter an integer.
      NO SPACES, TABS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '456'
  - sub_id: '2.5'
    question_type: short_answer
    question: |
      Start from city A, what is the path representation of the optimal tour? Enter the path representation in the text box, or enter NIL if it is not possible to determine the optimal tour.

      Enter a comma separated list of cities (city labels).
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: A,B,C
    correct_answer: A,C,E,D,B,F
- id: 3
  type: comprehension
  label: SEARCH FOR OPTIMAL SOLUTION
  description: |
    The figure shows a map on a uniform grid where each tile is 10x10 in size. The start node is S and the goal node is G and the cost of each edge is 5 units. The MoveGen function returns nodes in alphabetical order. Use Manhattan Distance as the heuristic function. Where necessary, use node labels to break ties.

    ```mermaid
    graph TD
        G((G)) ---|5| K((K))
        G ---|5| M((M))
        G ---|5| L((L))
        K ---|5| L
        M ---|5| L
        L ---|5| H((H))
        L ---|5| F((F))
        L ---|5| E((E))
        H ---|5| E
        F ---|5| E
        F ---|5| B((B))
        E ---|5| B
        E ---|5| D((D))
        B ---|5| D
        B ---|5| C((C))
        B ---|5| A((A))
        B ---|5| S((S))
        C ---|5| S
        A ---|5| S
    ```

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '3.1'
    question_type: short_answer
    question: |
      What is the path found by A*? Enter the path as a comma separated list of node labels.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z
    correct_answer: S,B,F,L,G
  - sub_id: '3.2'
    question_type: short_answer
    question: |
      What is the cost of the path found by A*?

      Enter an integer.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 17
    correct_answer: '20'
  - sub_id: '3.3'
    question_type: multiple_choice
