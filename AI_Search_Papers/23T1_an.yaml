- id: 4
  type: comprehension
  label: GAMES
  description: "The figure shows a 3-ply game tree with evaluation function values defined at horizon. The nodes in the horizon are labeled from A to L. Use these labels when asked to enter a horizon node or a list of horizon nodes.\n\n**Tie-breaker**: when several nodes qualify then select the left most node, if tie persists then select the deepest node among the left most nodes.\n\n```mermaid\ngraph TD\n    R[\"MAX\"] --> N1((\"MIN\"))\n    R --> N2((\"MIN\"))\n    R --> N3((\"MIN\"))\n    \n    N1 --> N11[\"MAX\"]\n    N1 --> N12[\"MAX\"]\n    \n    N2 --> N21[\"MAX\"]\n    N2 --> N22[\"MAX\"]\n    \n    N3 --> N31[\"MAX\"]\n    N3 --> N32[\"MAX\"]\n    \n    N11 --> A((\"A: 29\"))\n    N11 --> B((\"B: 46\"))\n    N12 --> C((\"C: 75\"))\n    N12 --> D((\"D: 96\"))\n    \n    N21 --> E((\"E: 13\"))\n    N21 --> F((\"F: 36\"))\n    N22 --> G((\"G: 99\"))\n    N22 --> H((\"H: 28\"))\n    \n    N31 --> I((\"I: 33\"))\n    N31 --> J((\"J: 26\"))\n    N32 --> K((\"K: 37\"))\n    N32 --> L((\"L: 18\"))\n```\n\nBased on the above data, answer the given subquestions.\n"
  subquestions:
  - sub_id: '4.1'
    question_type: multiple_choice
    question: Which of the following is a strategy for MAX?
    options:
      A: A,B
      B: A,B,E,F,I,J
      C: I,K
      D: A,E,I,K
    correct_option: C
  - sub_id: '4.2'
    question_type: short_answer
    question: |
      List the horizon nodes in the best strategy for MAX. Enter the nodes in the ascending order of node labels.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: B,D
  - sub_id: '4.3'
    question_type: short_answer
    question: |
      List all the horizon nodes pruned by Alpha-Beta.

      Enter a comma separated sorted list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: D,G,H,K,L
  - sub_id: '4.4'
    question_type: short_answer
    question: |
      Force the MinMax value to 36 by changing the eval of only one horizon node. Select the horizon node that you want to change and select the largest possible value for that node.

      Enter the node label and the new value as a comma separated list.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,17
    correct_answer: B,36
- id: 5
  type: comprehension
  label: PROBLEM DECOMPOSITION
  description: |
    The figure shows an AND-OR graph that depicts how a problem S can be decomposed into one or more simpler problems. Nodes are uniquely identified by labels (S, A, B, ...). The number in each node is the heuristic estimate of the cost of solving that node.

    Nodes shown in double lines are primitive nodes and their values are actual costs. Observe that a primitive node is added to the graph by its parent when the parent is expanded, and the primitive node is labeled as SOLVED and it will not be expanded subsequently.

    The cost of each edge is 2 units.

    **Tie-breaker 1**: For nodes with the same cost, expand in the ascending order of node labels.
    **Tie-breaker 2**: For AND nodes, expand the unsolved branch with the highest cost.

    ```mermaid
    graph TD
        S((S: 10)) --> A((A: 12))
        S ---|AND| B((B: 2))
        S ---|AND| C((C: 6))
        A --> D[[D: 30]]
        A --> E((E: 10))
        B --> E
        B --> F((F: 10))
        C --> F
        E --> G[[G: 10]]
        F --> G
        F --> H[[H: 20]]
    ```

    Use AO* algorithm to solve S, then answer the given subquestions.
  subquestions:
  - sub_id: '5.1'
    question_type: short_answer
    question: |
      List the first three nodes (including S) expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: S,C,A
  - sub_id: '5.2'
    question_type: short_answer
    question: |
      Determine the value of the start node S after each node expansion. Ignore the initial value of S and list the first three values of S computed from the first three node expansions.

      Enter a comma separated list of numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12,42,17
    correct_answer: 12,14,14
  - sub_id: '5.3'
    question_type: short_answer
    question: |
      What is the final value of the start node S?

      Enter a number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '16'
