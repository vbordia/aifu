        correct_answer: "a,e,2,5,p"

  - id: 9
    type: comprehension
    label: "PROBLEM DECOMPOSITION"
    description: |
      The figure shows an AND-OR graph that depicts how a problem $S$ can be decomposed and transformed into one or more simpler problems. Nodes are uniquely identified by labels ($S, A, B, \dots$). The number in each node is the heuristic estimate of the cost of solving that node.

      Nodes with double lines are primitive nodes and their values are actual costs. Observe that a primitive node is added to the graph by its parent when the parent is expanded, and the primitive node is labeled as **SOLVED** and it will not be expanded subsequently.

      - **Tie-breaker 1**: For nodes with the same cost, expand in the ascending order of node labels.
      - **Tie-breaker 2**: For AND nodes, expand the unsolved branch with the highest cost.
      - Each edge has a unit cost. Solve for $S$.

      ```mermaid
      graph TD
          S["S: 100"]
          A[["A (primitive): 20"]]
          B["B: 200"]
          C["C: 100"]
          D["D: 160"]
          E[["E (primitive): 40"]]
          F[["F (primitive): 60"]]
          G["G: 80"]
          H[["H (primitive): 100"]]
          I[["I (primitive): 140"]]
          J[["J (primitive): 100"]]
          K[["K (primitive): 90"]]

          S --- A
          S --- B
          S --- C
          S --- D
          D --- I
          B --- E
          B --- F
          C --- G
          C --- H
          G --- J
          G --- K
      ```
    subquestions:
      - sub_id: 9.1
        question_type: short_answer
        question: "List the first three nodes (including S) expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.\n\nEnter a comma separated list of node labels.\nNO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.\nAnswer format: X,Y,Z"
        correct_answer: "S,C,D"

      - sub_id: 9.2
        question_type: short_answer
        question: "Determine the value of the start node S after each node expansion. List the first three values of S that correspond to the first three node expansions.\n\nEnter a comma separated list of numbers.\nNO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.\nAnswer format: 12,42,17"
        correct_answer: "101,161,183"

      - sub_id: 9.3
        question_type: short_answer
        question: "What is the final value of the start node S?\n\nEnter a number.\nNO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.\nAnswer format: 42"
        correct_answer: "194"

      - sub_id: 9.4
        question_type: multiple_choice
        question: "In the given AND-OR graph, is the heuristic admissible?"
        options:
          A: "No"
          B: "Yes"
          C: "Cannot be determined"
        correct_option: "A"

