    question: |
      In the map, nodes are placed on a grid where each tile is $10 \times 10$ in size, is the Manhattan distance heuristic admissible?

      ```mermaid
      graph LR
          S((S)) ---|12| B((B))
          S ---|12| A((A))
          S ---|24| C((C))
          B ---|12| D((D))
          B ---|12| C
          B ---|24| G((G))
