- id: 4
  type: comprehension
  label: PROBLEM DECOMPOSITION
  description: |
    The figure shows an AND-OR graph that depicts how a problem S can be decomposed into one or more smaller problems.
    Nodes are uniquely identified by labels (S, A, B, ...). The number in each node is the heuristic estimate of the cost of solving that node.

    Nodes shown in double lines are primitive nodes and their values are actual costs.
    Observe that a primitive node is added to the graph by its parent when the parent is expanded, and the primitive node is labeled as SOLVED and it will not be expanded subsequently.

    The cost of each edge is 2 units.

    **Tie-breaker 1**: If several nodes have the same cost then break the tie using node labels.
    **Tie-breaker 2**: For AND nodes, select the unsolved branch having the highest cost.

    ```mermaid
    graph TD
        S((S: 10)) ---|OR| A((A: 10))
        S ---|AND| B((B: 10))
        S ---|AND| C((C: 14))
        A ---|AND| D[["D (primitive): 30"]]
        A ---|AND| E[["E (primitive): 20"]]
        B ---|AND| E
        B ---|AND| F[["F (primitive): 16"]]
        C --- F
        C --- G[["G (primitive): 18"]]
    ```
    AND arcs: S = AND(B,C) or OR(A); A = AND(D,E); B = AND(E,F); C = OR(F,G) (no arc at C). Primitives: D, E, F, G.
  subquestions:
  - sub_id: '4.1'
    question_type: short_answer
    question: |
      List the first three nodes (including S) expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answers:
    - S,A,C
    - A,C,B
  - sub_id: '4.2'
    question_type: short_answer
    question: |
      Determine the value of the start node S after each node is expanded. What are the values of S after the 1st, 2nd and 3rd nodes are expanded, respectively? Enter the 3 values in the textbox.

      Enter a comma separated list of numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12,42,17
    correct_answers:
    - 28,32,56
    - 22,28,32
  - sub_id: '4.3'
    question_type: short_answer
    question: |
      What is the final value of the start node S?

      Enter a number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '56'
