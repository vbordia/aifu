questions:
- id: 1
  type: comprehension
  label: SEARCH
  description: |
    Consider a water-jug puzzle with three jugs a, b and c of capacities 5L, 3L and 2L, respectively.

    A state, encoded as a digit string ABC, denotes volume of water in jugs a, b and c, respectively.
    For example, state 212 denotes that jugs a, b and c contain 2L, 1L and 2L of water, respectively.

    The allowable moves (actions) are:
    - `xETy`: pick up jug x and empty it into jug y and jug y is also topped up,
    - `xEy`: pick up jug x and empty it into jug y and jug y is still not topped up,
    - `xTy`: pick up jug x and top up jug y and jug x is still not emptied out.

    For example: $212 \xrightarrow{cEa} 410 \xrightarrow{aTb} 230 \xrightarrow{bETa} 500$.

    `MoveGen` takes a state ABC and returns a set of neighbours that are one move away from ABC.
    For example, $\text{MoveGen}(212) = \{ 032, 302, 410, 230 \}$.

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '1.1'
    question_type: short_answer
    question: |
      Let 320 be the start state and 401 be the goal state, find the shortest path from start to goal. Enter the path starting with 320 as a comma separated list of states.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 320,302,500
    correct_answer: 320,122,131,401
  - sub_id: '1.2'
    question_type: short_answer
    question: |
      Let 320 be the start state and 401 be the goal state, find the sequence of moves that produce the shortest path from start to goal. Enter the sequence of moves as a comma separated list.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: aEb,aTc,bETa,cETb
    correct_answer: aTc,cTb,bEa
- id: 2
  type: comprehension
  label: SEARCH ALGORITHMS
  description: Answer the given subquestions.
  subquestions:
  - sub_id: '2.1'
    question_type: multiple_choice
    question: Which of the following variants of Depth First Iterative Deepening (DFID) is guaranteed to find the shortest path if one exists?
    options:
      A: DFID that inspects only new nodes.
      B: DFID that inspects new as well as open nodes.
      C: DFID that inspects new as well as closed nodes.
      D: None of these.
    correct_option: C
  - sub_id: '2.2'
    question_type: multiple_select
    question: Given a finite state space with edge costs that may or may not be Euclidean and a heuristic function whose properties are not known, which of the following algorithms are suitable for finding the optimal path?
    options:
      A: Depth First Search
      B: Breadth First Search
      C: Dijkstra's algorithm
      D: Branch and Bound Search
      E: A*
      F: WA* for some w
      G: Sparse Memory Graph Search (SMGS)
    correct_options:
    - C
    - D
  - sub_id: '2.3'
    question_type: multiple_select
    question: If w is set to zero then wA* algorithm will __________ .
    options:
      A: behave like Best-First Search
      B: behave like Dijkstra's algorithm
      C: always find the optimal path
      D: sometimes find a suboptimal path
    correct_options:
    - B
    - C
- id: 3
  type: comprehension
  label: 'GAMES: ALPHA-BETA'
  description: |
    Consider a game tree with the root node as MAX, where an arbitrary path from the root reaches the subtree shown in the figure.

    ```mermaid
    graph TD
        Root["MIN Node<br/>(α=2, β=4)"]
        N1["MAX Node 1"]
        N2["MAX Node 2"]
        A["A (?)"]
        B["B (?)"]
        C["C (?)"]
        D["D (?)"]

        Root --- N1
        Root --- N2
        N1 --- A
        N1 --- B
        N2 --- C
        N2 --- D
    ```

    Each leaf node A to D takes a UNIQUE EVAL VALUE from the set {1, 2, 3, 4}.
    Alpha-Beta algorithm is entering the subtree with alpha=2 and beta=4;
    find an optimal eval assignment (for nodes A to D) that maximizes the number of leaves pruned;
    find the minimax value, the type of cuts and the leaves pruned for that assignment.

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '3.1'
    question_type: short_answer
    question: |
      Enter the optimal eval assignment (evals of nodes A to D) in the text box.

      Enter a comma separated list of evals.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 1,2,3,4
    correct_answer: 1,3,2,4
  - sub_id: '3.2'
    question_type: short_answer
    question: |
      The minimax value of the subtree for the optimal eval assignment is __________ .

      Enter an integer.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
    correct_answer: '2'
  - sub_id: '3.3'
    question_type: short_answer
    question: |
      Enter the number of alpha-cuts followed by the number of beta-cuts as a comma separated list.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 1,2
    correct_answer: 2,0
  - sub_id: '3.4'
    question_type: short_answer
    question: |
      Enter the label of leaf nodes pruned by Alpha-Beta algorithm, or enter NIL if no leaves were pruned.

      Enter a comma separated list of labels (A to D), or enter NIL.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: W,X,Y,Z
    correct_answer: B,D
- id: 4
  type: comprehension
  label: 'GAMES: SSS STAR'
  description: "The figure shows a game tree with evaluation function values at the horizon nodes. \nThe horizon nodes are labeled from A to J.\nWhere applicable, use these labels in short answers.\n\n**Tie-breaker**:\nWhen several nodes carry the same best cost then select the deepest node, if tie persists then select the leftmost of the deepest nodes to break the tie.\n\n```mermaid\ngraph TD\n    R[\"Root (MIN)\"]\n    N1[\"Circle 1 (MAX)\"]\n    N2[\"Circle 2 (MAX)\"]\n    N3[\"Circle 3 (MAX)\"]\n\n    R --- N1\n    R --- N2\n    R --- N3\n\n    S1[\"Square 1 (MIN)\"]\n    S2[\"Square 2 (MIN)\"]\n    N1 --- S1\n    N1 --- S2\n\n    S3[\"Square 3 (MIN)\"]\n    N2 --- S3\n\n    S4[\"Square 4 (MIN)\"]\n    S5[\"Square 5 (MIN)\"]\n    N3 --- S4\n    N3 --- S5\n\n    C1[\"Circle (MAX)\"]\n    S1 --- C1\n    A[\"A: 4\"]\n    B[\"B: 0\"]\n    C1 --- A\n    C1 --- B\n\n    C2[\"Circle (MAX)\"]\n    S2 --- C2\n    C[\"C: 9\"]\n    D[\"D: 8\"]\n    C2 --- C\n    C2 --- D\n\n    C3[\"Circle (MAX)\"]\n    C4[\"Circle (MAX)\"]\n    S3 --- C3\n    S3 --- C4\n    E[\"E: 5\"]\n    F[\"F: 7\"]\n    C3 --- E\n    C4 --- F\n\n    C5[\"Circle (MAX)\"]\n    S4 --- C5\n    G[\"G: 2\"]\n    H[\"H: 6\"]\n    C5 --- G\n    C5 --- H\n\n    C6[\"Circle (MAX)\"]\n    S5 --- C6\n    I[\"I: 3\"]\n    J[\"J: 1\"]\n    C6 --- I\n    C6 --- J\n```\n\nRun SSS* algorithm on the game tree, then answer the sub-questions.\n"
  subquestions:
  - sub_id: '4.1'
    question_type: short_answer
    question: |
      Find the horizon nodes that are assigned SOLVED status by SSS* algorithm. Enter the labels of those nodes in the textbox, or enter NIL if no nodes are assigned SOLVED status.

      Enter node labels as a comma separated list in alphabetical order.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: A,E,F,G
  - sub_id: '4.2'
    question_type: short_answer
    question: |
      Find the SOLVED horizon nodes that are pruned from the queue by SSS* algorithm, i.e., SOLVED horizon nodes removed from the queue when a MAX-ancestor is SOLVED. Enter the labels of those nodes in the textbox, or enter NIL if SOLVED nodes were never pruned.

      Enter node labels as a comma separated list in alphabetical order.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: A,E,G
- id: 5
  type: comprehension
  label: PROBLEM DECOMPOSITION
  description: |
    The figure shows an AND-OR decomposition of problem S into smaller problems. The nodes are uniquely identified by labels (S, A, B, C, …).

    Each node shows the heuristic estimate of the cost of solving that node.
    Nodes shown in double lines are primitive nodes and their values are actual costs.
    A primitive node is added to the graph, with SOLVED status, when its parent is expanded. And therefore, a primitive node is never expanded.

    The cost of each edge is 2 units.

    **Tie-breaker 1**: If several nodes have the same cost then break the tie using node labels.
    **Tie-breaker 2**: For AND nodes, select the unsolved branch with the highest cost.

    ```mermaid
    graph TD
        S(("S (10)"))
        A(("A (16)"))
        B(("B (14)"))
        C(("C (18)"))

        S --- A
        S --- B
        S --- C

        D(("D (14)"))
        E(("E (10)"))
        G[["G (20)"]]
        H[["H (10)"]]
        F(("F (8)"))

        A --- D
        A --- E
        D --- G
        E --- H

        B --- G
        B --- H

        C --- H
        C --- F
    ```

    Use AO* algorithm to solve S, then answer the sub-questions.
  subquestions:
  - sub_id: '5.1'
    question_type: short_answer
    question: |
      List the nodes expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z
    correct_answer: S,B,A,C,F
  - sub_id: '5.2'
    question_type: short_answer
    question: |
      For each node expanded by AO* algorithm, determine the value propagated to the start node S. Enter the values of S as a list.

      Enter a comma separated list of numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12,42,17
    correct_answer: 16,18,20,24,28
  - sub_id: '5.3'
    question_type: multiple_choice
    question: What can you conclude about the given AND-OR decomposition?
    options:
      A: The heuristic is admissible.
      B: The heuristic is inadmissible.
      C: The heuristic is sometimes admissible and sometimes inadmissible.
    correct_option: A
