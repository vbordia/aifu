- number: 1
  type: short_answer
  section: SEARCH
  context: |
    Consider a 5-4-1 water jug puzzle with three jugs $a, b, c$ of capacity $5\text{L}, 4\text{L}, 1\text{L}$, respectively. A state is represented as a three-digit string $ABC$, where $A, B, C$ denote the volume of water present in the jugs $a, b, c$, respectively. For example, $140$ denotes a state where jug $a$ has $1$ liter of water, jug $b$ has $4$ liters of water, and jug $c$ is empty.

    Two types of moves (state transitions) are allowed:
    - $x\text{E}y$: pick up jug $x$ and empty it into jug $y$
    - $x\text{F}y$: pick up jug $x$ and fill up (top up) jug $y$

    So the possible moves are: $a\text{E}b, a\text{E}c, a\text{F}b, a\text{F}c, b\text{E}a, b\text{E}c, b\text{F}a, b\text{F}c, c\text{E}a, c\text{E}b, c\text{F}a, c\text{F}b$.

    **Tie-breaker:** In some states, both $x\text{E}y$ and $x\text{F}y$ may produce the same output state; in such cases, choose $x\text{E}y$ to break the tie. For example, from the $140$ state, both $a\text{E}c$ and $a\text{F}c$ produce the same output state $041$, therefore, to break the tie choose $a\text{E}c$ as the move.

    For the 5-4-1 water jug puzzle, the `MoveGen` function takes a state $ABC$ and returns a set of states that can be produced in one move. For example, $\text{MoveGen}(500)$ returns $\{140, 401\}$.
