- number: 20
  type: multiple_select
  section: AUTOMATED PLANNING
  context: |
    The domain description of a Blocks World with a single one-armed robot is given below.

    **PREDICATES:**
    - $\text{armEmpty}$: The arm is not holding any block, it is empty.
    - $\text{holding}(X)$: The arm is holding $X$.
    - $\text{onTable}(X)$: $X$ is on the table.
    - $\text{clear}(X)$: $X$ has nothing above it, it is clear.
    - $\text{on}(X,Y)$: $X$ is directly placed on $Y$.

    **OPERATORS:**
    - $\text{Pickup}(X)$: Pick up $X$ from the table.
      - Preconditions: $\{\text{armEmpty}, \text{clear}(X), \text{onTable}(X)\}$
      - Add Effects: $\{\text{holding}(X)\}$
      - Del Effects: $\{\text{armEmpty}, \text{onTable}(X)\}$
    - $\text{Putdown}(X)$: Place $X$ on the table.
      - Preconditions: $\{\text{holding}(X)\}$
      - Add Effects: $\{\text{armEmpty}, \text{onTable}(X)\}$
      - Del Effects: $\{\text{holding}(X)\}$
    - $\text{Unstack}(X,Y)$: Pick up $X$ that is directly sitting on $Y$.
      - Preconditions: $\{\text{armEmpty}, \text{clear}(X), \text{on}(X,Y)\}$
      - Add Effects: $\{\text{clear}(Y), \text{holding}(X)\}$
      - Del Effects: $\{\text{armEmpty}, \text{on}(X,Y)\}$
    - $\text{Stack}(X,Y)$: Place $X$ directly on top of $Y$.
      - Preconditions: $\{\text{holding}(X), \text{clear}(Y)\}$
      - Add Effects: $\{\text{armEmpty}, \text{on}(X,Y)\}$
      - Del Effects: $\{\text{holding}(X), \text{clear}(Y)\}$

    **Planning Problem:**
    - **Start State:** $\{\text{onTable}(A), \text{onTable}(B), \text{onTable}(D), \text{on}(C,B), \text{clear}(A), \text{clear}(C), \text{clear}(D), \text{armEmpty}\}$
    - **Goal Description:** $\{\text{on}(D,B), \text{holding}(C)\}$
  question: Which of the following are applicable actions for the given problem?
  options:
  - text: Pickup(A)
    correct: true
  - text: Pickup(D)
    correct: true
  - text: Unstack(C,B)
    correct: true
  - text: Pickup(C)
    correct: false
  - text: Stack(D,B)
    correct: false
  - text: Unstack(D,B)
    correct: false
