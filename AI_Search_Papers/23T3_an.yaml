    - $X_2 \in \{d, e, f\}$
    - $X_3 \in \{1, 2, 3\}$
    - $X_4 \in \{4, 5, 6\}$
    - $X_5 \in \{p, q, r\}$

    **Constraint Edges in Graph:**
    - $(X_1, X_2)$, $(X_1, X_4)$, $(X_2, X_4)$, $(X_2, X_5)$, $(X_3, X_4)$, $(X_3, X_5)$

    **Allowed Value Pairs (Edges in Matching Diagram):**
    - Between $X_1$ and $X_2$: $(a,d), (a,e), (b,e), (b,f), (c,f)$
    - Between $X_1$ and $X_4$: $(a,4), (a,5), (b,5), (b,6), (c,6)$
    - Between $X_2$ and $X_4$: $(d,6), (e,5), (f,4)$
