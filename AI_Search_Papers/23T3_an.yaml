file: 2023T3_AI_Search_Methods_for_Problem_Solving_AN.pdf
year: 2023
term: 3
session: an
subject: 'DEGREE LEVEL: AI: SEARCH METHODS FOR PROBLEM SOLVING'
questions:
- id: 1
  type: comprehension
  label: SEARCH
  description: |
    The figure shows a map on a uniform grid where each tile is 1x1 in size.
    The start node is S and the goal node is G.
    The MoveGen function returns nodes in alphabetical order.
    Use Manhattan Distance as the heuristic function.
    Tie-breaker: If several nodes have the same cost, use node labels to break the tie.

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '1.1'
    question_type: short_answer
    question: |
      What is the path found by the Best First Search algorithm? Enter the path as a comma separated list of node labels.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z
    correct_answer: S,A,B,F,G
  - sub_id: '1.2'
    question_type: short_answer
    question: |
      What is the path found by A* search algorithm? Enter the path as a comma separated list of node labels.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z
    correct_answer: S,C,B,F,G
  - sub_id: '1.3'
    question_type: short_answer
    question: |
      What is the path found by Branch-and-Bound search algorithm? Enter the path as a comma separated list of node labels.

      Use the Branch-and-Bound variation that avoids cyclic expansions like S,A,S,A,S,A,...

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z
    correct_answer: S,C,D,E,H,I,G
  - sub_id: '1.4'
    question_type: multiple_choice
    question: For the given map, which algorithm finds the shortest path from S to G?
    options:
      A: A* Search Algorithm
      B: Branch-and-Bound Search Algorithm
      C: None of these
    correct_option: B
  - sub_id: '1.5'
    question_type: multiple_choice
    question: What can you say about the heuristic function for the given graph?
    options:
      A: Admissible
      B: Inadmissible
      C: Partly admissible and partly inadmissible
      D: Cannot be determined
    correct_option: B
- id: 2
  type: comprehension
  label: TSP BRANCH-AND-BOUND
  description: |
    The TSP Branch-and-Bound algorithm is solving a TSP instance where the cities are A, B, C, .... and so on. The Branch-and-Bound search tree at the time when the algorithm has discovered the optimal tour is shown below.

    Each node in the search tree displays an edge (either XY or ~XY), a cost value, and a unique reference number (a1, b1, b2, ..., c1, ..., d1, ..., e2, ..., f1, f2). Use the reference numbers to break ties. When required, enter the reference numbers in short answers.

    What information can you glean from the search tree? Answer the sub-questions based on the information gleaned from the search tree.
  subquestions:
  - sub_id: '2.1'
    question_type: short_answer
    question: |
      Let S0 (ref. no. a1) be the first node to be refined, identify the next 4 nodes (2nd to 5th node) that are refined by the TSP Branch-and-Bound algorithm. Enter the nodes (node reference numbers) in the order they are refined.

      Enter a comma separated list of node reference numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: a9,b9,c9,d9
    correct_answer: b1,c1,d2,c2
  - sub_id: '2.2'
    question_type: short_answer
    question: |
      Which node represents the optimal tour and what is the cost of the optimal tour? Enter the node reference number and the tour cost in the text box, or enter NIL if it is not possible to determine the optimal tour.

      Enter a node reference number followed by tour cost, separated by comma.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: a9,42
    correct_answer: e1,432
  - sub_id: '2.3'
    question_type: short_answer
    question: |
      Determine the number of cities in the TSP instance. Enter the number of cities in the text box, or enter NIL if it is not possible to determine the number of cities.

      Enter an integer.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '6'
  - sub_id: '2.4'
    question_type: short_answer
    question: |
      Start from city A, what is the path representation of the optimal tour? Enter the path representation in the text box, or enter NIL if it is not possible to determine the optimal tour.

      Enter a comma separated list of cities (city labels).
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: A,B,C
    correct_answers:
    - A,B,C,E,F,D
    - A,D,F,E,C,B
- id: 3
  type: comprehension
  label: GAMES
  description: |
    The figure shows a game tree with evaluation function values at the horizon nodes.
    The horizon nodes are labeled from A to I.
    Use these labels to enter a horizon node or a list of horizon nodes in short answers (textbox).

    Tie-breaker: when several nodes carry the same best cost then select the deepest node, if tie persists then select the leftmost of the deepest nodes to break the tie.

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '3.1'
    question_type: multiple_choice
    question: Which of the following is a strategy for the MAX player?
    options:
      A: A,B,C
      B: A,B
      C: A,D,G
      D: G,H,I
    correct_option: B
  - sub_id: '3.2'
    question_type: short_answer
    question: |
      List the horizon nodes in the best strategy for MAX. Enter the node labels in alphabetical order.

      Enter a comma separated list of node labels in alphabetical order.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: G,H
  - sub_id: '3.3'
    question_type: short_answer
    question: |
      List the horizon nodes pruned by Alpha-Beta.

      Enter a comma separated list of node labels in alphabetical order.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: C,E,F,I
  - sub_id: '3.4'
    question_type: short_answer
    question: |
      List the horizon nodes not processed (neither LIVE nor SOLVED) by SSS*.

      Enter a comma separated list of node labels in alphabetical order.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: B,C,E,F,I
- id: 4
  type: comprehension
  label: PROBLEM DECOMPOSITION
  description: |
    The figure shows an AND-OR graph that depicts how a problem S can be decomposed into one or more smaller problems. Nodes are uniquely identified by labels (S, A, B, ...). The number in each node is the heuristic estimate of the cost of solving that node.

    Nodes shown in double lines are primitive nodes and their values are actual costs. Observe that a primitive node is added to the graph by its parent when the parent is expanded, and the primitive node is labeled as SOLVED and it will not be expanded subsequently.

    The cost of each edge is 1 unit.

    Tie-breaker 1: If several nodes have the same cost then break the tie using node labels.
    Tie-breaker 2: For AND nodes, select the unsolved branch with the highest cost.

    Use AO* algorithm to solve S, then answer the given subquestions.
  subquestions:
  - sub_id: '4.1'
    question_type: short_answer
    question: |
      List the first three nodes (including S) expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answers:
    - S,C,A
    - C,A,D
  - sub_id: '4.2'
    question_type: short_answer
    question: |
      Determine the value of the start node S after each node is expanded. What are the values of S after the 1st, 2nd and 3rd nodes are expanded, respectively? Enter the 3 values in the textbox.

      Enter a comma separated list of numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12,42,17
    correct_answers:
    - 13,16,13
    - 16,13,18
  - sub_id: '4.3'
    question_type: short_answer
    question: |
      What is the final value of the start node S?

      Enter a number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '18'
- id: 5
  type: comprehension
  label: RULE BASED EXPERT SYSTEMS
  description: |
    A part of the Rete Net that classifies mushrooms (as edible or poisonous) is shown in the figure. The labels A1, A2, ..., A10, A16, ..., B1, B2, B3, R1, ..., R4 uniquely identify the nodes in the network. When required, use the above label ordering to break ties and to enter short answers.

    Run the Rete algorithm for the Working Memory shown below, the WMEs are in timestamp order. Assume that WMEs reside at appropriate Alpha nodes, and the Beta nodes point to WMEs residing in Alpha nodes.

    ```text
    201. (Mushroom ^specimen B43 ^odour ALMOND ^sp-colour BROWN)
    202. (Stalk ^specimen B43 ^br-surface SMOOTH)
    203. (Mushroom ^specimen K13 ^odour NONE ^habitat LEAVES)
    204. (Cap ^specimen A23 ^colour RED ^surface SMOOTH)
    205. (Mushroom ^specimen B37 ^odour NONE ^habitat LEAVES)
    206. (Cap ^specimen B37 ^colour WHITE ^surface SMOOTH)
    207. (Stalk ^specimen A23 ^root BULBOUS ^ar-colour WHITE)
    208. (Stalk ^specimen K13 ^br-surface SCALY ^ar-colour WHITE)
    209. (Mushroom ^specimen A23 ^odour NONE ^sp-colour WHITE)
    ```

    For each WME identify its location (node label) in the Rete Net, and prepare the conflict set for the first cycle, then answer the given subquestions.
  subquestions:
  - sub_id: '5.1'
    question_type: multiple_select
    question: Which of the following rule-data tuples are in the conflict-set?
    options:
      A: R1,205,206
      B: R2,209
      C: R3,204,207
      D: R4,203,208
      E: R1,203,206
      F: R4,205,208
    correct_options: [A, B, C, D]
  - sub_id: '5.2'
    question_type: multiple_select
    question: If the Inference Engine uses Specificity as the conflict resolution strategy then which of the following rule-data tuples will qualify?
    options:
      A: R1,205,206
      B: R2,209
      C: R3,204,207
      D: R4,203,208
      E: R1,203,206
      F: R4,205,208
    correct_options: [C, D]
  - sub_id: '5.3'
    question_type: multiple_choice
    question: If the Inference Engine uses Recency as the conflict resolution strategy then which of the following rule-data tuples will qualify?
    options:
      A: R1,205,206
      B: R2,209
      C: R3,204,207
      D: R4,203,208
      E: R1,203,206
      F: R4,205,208
    correct_option: B
- id: 6
  type: comprehension
  label: AUTOMATED PLANNING
  description: |
    The domain description of a Blocks World with a single one-armed robot is given below.

    Consider the planning problem with the following start state and goal description.

    Start State: { armEmpty, on(A,B), on(C,D), clear(A), clear(C), onTable(B), onTable(D) }

    Goal Description: { on(A,C), on(C,B), onTable(B) }

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '6.1'
    question_type: multiple_select
    question: Which of the following are applicable actions in the start state?
    options:
      A: Unstack (A,B)
      B: Unstack (C,D)
      C: Putdown (B)
      D: Stack (C,B)
      E: Stack (A,C)
    correct_options: [A, B]
  - sub_id: '6.2'
    question_type: multiple_select
    question: Which of the following are relevant actions in the goal state?
    options:
      A: Unstack (A,B)
      B: Unstack (C,D)
      C: Putdown (B)
      D: Stack (C,B)
      E: Stack (A,C)
    correct_options: [C, D, E]
  - sub_id: '6.3'
    question_type: multiple_select
    question: In the planning graph, which of the following are mutex action pairs in Layer 1?
    options:
      A: Unstack(A,B), Unstack(C,D)
      B: Unstack(C,D), NOP-ACTION for armEmpty
      C: Unstack(A,B), NOP-ACTION for on(A,B)
      D: Putdown(B), Stack(C,B)
      E: Stack(A,C), Stack(C,B)
    correct_options: [A, B, C]
  - sub_id: '6.4'
    question_type: multiple_select
    question: In the planning graph, which of the following are mutex proposition pairs in Layer 1?
    options:
      A: clear (B), armEmpty
      B: holding (A), clear (D)
      C: armEmpty, on (A,B)
      D: on (A,B), on (C,D)
    correct_options: [A, B]
- id: 7
  type: comprehension
  label: CONSTRAINT SATISFACTION
  description: |
    The set of junctions (L, W, Y and T type junctions) that occur in a 2D line drawing of trihedral objects is provided below. The in-plane clockwise/counterclockwise rotations of these junctions are valid as well. These junctions provide constraints on the possible edge assignments (convex, concave, arrow) for the edges/lines in 2D line drawings of trihedral objects.

    The junctions carry unique labels: L1, L2, L3, L4, L5, L6, T1, T2, T3, T4, W1, W2, W3, Y1, Y2, Y3. When required, use the labels in short answers.

    Note: A 2D line drawing of trihedral objects is considered to be consistent if all the edges and junctions can be assigned labels that are consistent with each other, otherwise the drawing is considered to be inconsistent and all labels are reset to NIL.

    Apply a suitable algorithm to assign consistent labels to edges/junctions in the 2D line drawings in the sub-questions. Choose a suitable edge and junction order for solving the problems.

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '7.1'
    question_type: short_answer
    question: |
      Assign consistent labels to all the edges and junctions in the 2D line drawing shown below.

      Enter the labels of the junctions 1, 2, 3, 4 in the text box, in that order. Otherwise enter NIL if the drawing has no consistent label assignment.

      Enter a comma separated list of junction labels, or enter NIL.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X9,Y9,Z9,W9
    correct_answers:
    - Y1,W1,L1,W1
    - Y1,W2,L2,W1
    - Y2,W1,L2,W1
