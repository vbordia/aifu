    options:
      A: Luxury-Car,104,107
      B: Minivan,103,106
      C: Truck,101,102,105
      D: Minivan,103,106,108
    correct_option: C
  - sub_id: '5.3'
    question_type: multiple_choice
    question: If the Inference Engine uses Recency for conflict resolution which rule-data tuple will fire in the first round?
    options:
