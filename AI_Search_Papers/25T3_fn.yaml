questions:
- id: 1
  type: comprehension
  label: SEARCH
  description: |
    The figure shows a map on a uniform grid where each tile is 1x1 in size.
    The start node is S and the goal node is G.
    The MoveGen function returns nodes in alphabetical order.
    Use Manhattan Distance as the heuristic function.

    **Tie-breaker**: If several nodes have the same cost, use node labels to break the tie.

    ```mermaid
    graph TD
        S((S)) ---|1| A((A))
        S ---|4| B((B))
        A ---|1| C((C))
        A ---|2| D((D))
        B ---|1| D
        B ---|2| E((E))
        C ---|1| F((F))
        D ---|2| F
        D ---|2| G((G))
        E ---|1| G
        F ---|1| G
    ```
  subquestions:
  - sub_id: '1.1'
    question_type: short_answer
    question: |-
      What is the path found by the Best First Search algorithm? Enter the path as a comma separated list of node labels.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z,G
    correct_answer: S,B,D,G
  - sub_id: '1.2'
    question_type: short_answer
    question: |-
      What is the path found by A* search algorithm? Enter the path as a comma separated list of node labels.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z,G
    correct_answer: S,A,D,G
  - sub_id: '1.3'
    question_type: short_answer
    question: |-
      What is the path found by Branch-and-Bound search algorithm? Enter the path as a comma separated list of node labels.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: S,X,Y,Z,G
    correct_answer: S,A,C,F,G
  - sub_id: '1.4'
    question_type: multiple_choice
    question: For the given map, which algorithm finds the shortest path from S to G?
    options:
      A: A* Search Algorithm
      B: Branch-and-Bound Search Algorithm
      C: Both A* and Branch-and-Bound Search Algorithms
      D: None of these
    correct_option: B
  - sub_id: '1.5'
    question_type: multiple_choice
    question: Select the correct statement about the given graph.
    options:
      A: Heuristic is admissible.
      B: Heuristic is not admissible.
      C: Heuristic is admissible in some cases and not admissible in other cases.
      D: There is not enough information to determine admissibility.
    correct_option: B
- id: 2
  type: comprehension
  label: 'GAMES: ALPHA-BETA'
  description: |
    Consider a game tree with the root node as MAX.
    Alpha-Beta algorithm is in mid-flight currently processing a path from the root to a node labeled N.
    The snapshot of evals of nodes along the current path is: 2, 14, 4, 10, N.
    Where evals are restricted to EVEN NUMBERS greater than zero and less than 15.
  subquestions:
  - sub_id: '2.1'
    question_type: short_answer
    question: |-
      Determine the eval of node N that will induce a cutoff to prune its siblings.

      Enter an even number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 16
    correct_answer: '2'
  - sub_id: '2.2'
    question_type: multiple_choice
    question: What type of cut-off is induced by the eval selected for N?
    options:
      A: Alpha Cutoff
      B: Beta Cutoff
      C: Alpha-Beta Cutoff
      D: None of these
    correct_option: A
- id: 3
  type: comprehension
  label: 'GAMES: SSS STAR'
  description: |
    The figure shows a game tree with evaluation function values at the horizon nodes.
    The horizon nodes are labeled from A to D.
    Use these labels to enter a horizon node or a list of horizon nodes in short answers.

    **Tie-breaker**:
    When several nodes carry the same best cost then select the deepest node, if tie persists then select the leftmost of the deepest nodes to break the tie.

    Run SSS* algorithm on the game tree, then answer the sub-questions.

    ```mermaid
    graph TD
        Root[Root] --- L((MIN))
        Root --- R((MIN))
        L --- L1[MAX]
        R --- R1[MAX]
        L1 --- LA((MIN))
        L1 --- LB((MIN))
        R1 --- RA((MIN))
        R1 --- RB((MIN))
        LA --- A(("A: 11"))
        LB --- B(("B: 70"))
        RA --- C(("C: 48"))
        RB --- D(("D: 54"))
    ```
  subquestions:
  - sub_id: '3.1'
    question_type: short_answer
    question: |-
      List the horizon nodes assigned SOLVED status by SSS* algorithm, then enter the labels of those nodes in the textbox, or enter NIL if no nodes are assigned SOLVED status.

      Enter node labels as a comma separated list in alphabetical order.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: A,B,C,D
  - sub_id: '3.2'
    question_type: short_answer
    question: |-
      List the horizon nodes pruned by SSS* algorithm, i.e., horizon nodes removed from the queue by MAX-ancestor. Enter the labels of those nodes in the textbox, or enter NIL if no nodes are pruned.

      Enter node labels as a comma separated list in alphabetical order.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: A,C,D
- id: 4
  type: comprehension
  label: PROBLEM DECOMPOSITION
  description: |
    The figure shows an AND-OR decomposition of problem S into smaller problems.
    The nodes are uniquely identified by labels (S, A, B, C, …).

    Each node shows the heuristic estimate of the cost of solving that node.
    Nodes shown in double lines are primitive nodes and their values are actual costs.

    A primitive node is added to the graph, with SOLVED status, when its parent is expanded. And therefore, a primitive node is never expanded.

    The cost of each edge is 2 units.

    **Tie-breaker 1**: If several nodes have the same cost then break the tie using node labels.
    **Tie-breaker 2**: For AND nodes, select the unsolved branch with the highest cost.

    Use AO* algorithm to solve S, then answer the sub-questions.

    ```mermaid
    graph TD
        S((S: 10)) ---|OR| A((A: 30))
        S ---|AND| B((B: 6))
        S ---|AND| C((C: 12))
        A --- D((D: 10))
        A ---|AND| E((E: 4))
        A ---|AND| I[[I: 4]]
        E ---|AND| H[[H: 2]]
        E ---|AND| I
        B ---|AND| F((F: 1))
        B ---|AND| G((G: 3))
        B ---|OR| K[[K: 8]]
        F --- J[[J: 6]]
        G ---|AND| J
        G ---|AND| K
        C ---|AND| K
        C ---|AND| L[[L: 2]]
    ```
    AND arcs: S is solved by AND(B,C) or by A alone; A by AND(E,I) or by D alone; E by AND(H,I); B by AND(F,G) or by K alone; G by AND(J,K); C by AND(K,L). Primitives: H, I, J, K, L.
  subquestions:
  - sub_id: '4.1'
    question_type: short_answer
    question: |-
      List the nodes expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: S,C,B,G
  - sub_id: '4.2'
    question_type: short_answer
    question: |-
      For each node expanded by AO* algorithm, determine the value propagated to the start node S. Enter the values of S as a list.

      Enter a comma separated list of numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12,42,17
    correct_answer: 22,24,26,28
  - sub_id: '4.3'
    question_type: multiple_choice
    question: What can you conclude about the given AND-OR decomposition?
    options:
      A: The heuristic is admissible.
      B: The heuristic is inadmissible.
      C: The heuristic is sometimes admissible and sometimes inadmissible.
    correct_option: B
