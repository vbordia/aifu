- id: 7
  type: comprehension
  label: AUTOMATED PLANNING 2
  description: |
    The domain description of a Blocks World with a single one-armed robot is given below.

    **PREDICATES**
    - `armEmpty`: The arm is not holding any block, it is empty.
    - `holding(X)`: The arm is holding X.
    - `onTable(X)`: X is on the table.
    - `clear(X)`: X has nothing above it, it is clear.
    - `on(X,Y)`: X is directly placed on Y.

    **OPERATORS**
    - `Pickup(X)`: pick up X from the table.
      - Preconditions: { `armEmpty`, `clear(X)`, `onTable(X)` }
      - Add Effects: { `holding(X)` }
      - Del Effects: { `armEmpty`, `onTable(X)` }
    - `Putdown(X)`: place X on the table.
      - Preconditions: { `holding(X)` }
      - Add Effects: { `armEmpty`, `onTable(X)` }
      - Del Effects: { `holding(X)` }
    - `Unstack(X,Y)`: pick up X that is directly sitting on Y.
      - Preconditions: { `armEmpty`, `clear(X)`, `on(X,Y)` }
      - Add Effects: { `clear(Y)`, `holding(X)` }
      - Del Effects: { `armEmpty`, `on(X,Y)` }
    - `Stack(X,Y)`: place X directly on top of Y.
      - Preconditions: { `holding(X)`, `clear(Y)` }
      - Add Effects: { `armEmpty`, `on(X,Y)` }
      - Del Effects: { `holding(X)`, `clear(Y)` }

    **NOTE**: variables X and Y must bind to different objects

    The GraphPlan algorithm is in mid-flight solving a planning problem, from the planning graph two consecutive propositional layers (layer k and k+1) are presented.

    Both proposition layers are fully populated (no missing propositions).
    Mutex proposition pairs in layer k are:
    `(on(A,B), holding(A))`, `(on(A,B), clear(B))`, `(armEmpty, clear(B))`, `(armEmpty, holding(A))`.

    Populate the action layer and mutex links, then answer the sub-questions.
  subquestions:
  - sub_id: '7.1'
    question_type: multiple_choice
    question: What can you conclude about layer k?
    options:
      A: Layer k describes the start state of the planning problem.
      B: Layer k cannot describe the start state of the planning problem.
      C: There is insufficient information to comment on layer k.
    correct_option: B
  - sub_id: '7.2'
    question_type: multiple_select
    question: Which of the following are applicable actions in layer k+1?
    options:
      A: Putdown(A)
      B: Stack(A,B)
      C: Unstack(A,B)
      D: Unstack(B,C)
    correct_options:
    - A
    - B
    - C
  - sub_id: '7.3'
    question_type: multiple_select
    question: Which of the following are mutex pairs in layer k+1?
    options:
      A: Putdown(A) and Stack(A,B)
      B: Stack(A,B) and Unstack(A,B)
      C: nop-3 and nop-4
    correct_options:
    - A
    - B
    - C
  - sub_id: '7.4'
    question_type: multiple_choice
    question: armEmpty and clear(B) in layer k+1 are non mutex because __________ .
    options:
      A: nop-3 and nop-4 are non mutex
      B: PutDown(A) and nop-4 are non mutex
      C: None of these
    correct_option: B
- id: 8
  type: comprehension
  label: CONSTRAINT SATISFACTION
  description: |
    Consider a CSP over 3 variables A, B, C (processed in that order) with domains and constraints as shown below.

    $D_A = D_B = D_C = \{1, 2, \dots, 9\}$
    $R_{AB} = \{(2, 6), (3, 5)\}$
    $R_{AC} = \{(2, 7), (2, 8)\}$
    $R_{BC} = \{(4, 7), (5, 7), (6, 8)\}$

    Draw the constraint graph and matching-diagram then answer the sub-questions.
  subquestions:
  - sub_id: '8.1'
    question_type: multiple_choice
    question: Is the given CSP arc consistent?
    options:
      A: 'Yes'
      B: 'No'
      C: Cannot be determined
    correct_option: B
  - sub_id: '8.2'
    question_type: multiple_choice
    question: If the given CSP is not already arc consistent, make it arc consistent, then check if it is path consistent.
    options:
      A: It is path consistent.
      B: It is not path consistent.
      C: Path consistency does not apply because the constraint graph is cyclic.
    correct_option: A
  - sub_id: '8.3'
    question_type: short_answer
    question: |-
      Does the given CSP have a solution? Enter the solution for the variables A,B,C as a comma separated list. Enter NIL if there is no solution.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 1,2,3
    correct_answer: 2,6,8
