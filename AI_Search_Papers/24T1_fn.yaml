- id: 4
  type: comprehension
  label: PROBLEM DECOMPOSITION
  description: |
    The figure shows an AND-OR graph that depicts how a problem S can be decomposed into one or more smaller problems. Nodes are uniquely identified by labels (S, A, B, …). The number in each node is the heuristic estimate of the cost of solving that node.

    Nodes shown in double lines are primitive nodes and their values are actual costs. Observe that a primitive node is added to the graph by its parent when the parent is expanded, and the primitive node is labeled as SOLVED and it will not be expanded subsequently.

    The cost of each edge is 2 units.

    **Tie-breaker 1**: If several nodes have the same cost then break the tie using node labels.
    **Tie-breaker 2**: For AND nodes, select the unsolved branch with the highest cost.

    Use AO* algorithm to solve S, then answer the sub-questions.

    ```mermaid
    graph TD
        S(("S (10)")) --> A(("A (20)"))
        S --> B(("B (30)"))
        A --- AND1(( ))
        AND1 --> C[["C (primitive): 20"]]
        AND1 --> D[["D (primitive): 30"]]
        AND1 --> G[["G (primitive): 10"]]
        B --- AND2(( ))
        AND2 --> E(("E (20)"))
        AND2 --> F(("F (40)"))
        E --- AND3(( ))
        AND3 --> G
        AND3 --> H[["H (primitive): 20"]]
        F --- AND4(( ))
        AND4 --> H
        AND4 --> I[["I (primitive): 30"]]
    ```
  subquestions:
  - sub_id: '4.1'
    question_type: short_answer
    question: |
      List the first three nodes (including S) expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answers:
    - S,A,B
    - A,B,E
  - sub_id: '4.2'
    question_type: short_answer
    question: |
      Determine the value of the start node S after each node is expanded. What are the values of S after the 1st, 2nd and 3rd nodes are expanded, respectively? Enter the 3 values in the textbox.

      Enter a comma separated list of numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12,42,17
    correct_answers:
    - 22,32,24
    - 32,24,38
  - sub_id: '4.3'
    question_type: short_answer
    question: |
      What is the final value of the start node S?

      Enter a number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '38'
- id: 5
  type: comprehension
  label: RULE BASED EXPERT SYSTEMS
  description: |
    A Rete Net for classifying lenses based on surface properties (convex, concave, planar, radius of curvature, and number of sides) is shown in the figure. Each lens is uniquely identified by “itemNo” attribute, the remaining classes and attributes are self explanatory.

    A part of the Rete Net that classifies mushrooms (as edible or poisonous) is shown in the figure. The labels A1, A2, ..., A15, ..., B1, B2, …, B5, R1, …, R6 uniquely identify the nodes in the network. When required, use the above label ordering to break ties and to enter short answers.

    Note: beta nodes B4 and B5 compare the radius of curvature of two surfaces.

    ```mermaid
    graph TD
        WME["WME"] --> A1["A1: CLASS = Convex"]
        WME --> A2["A2: CLASS = Plane"]
        WME --> A3["A3: CLASS = Concave"]

        A1 --> A4["A4: itemNo = &lt;n&gt;"]
        A2 --> A5["A5: itemNo = &lt;n&gt;"]
        A3 --> A6["A6: itemNo = &lt;n&gt;"]

        A4 --> A7["A7: radius = &lt;a&gt;"]
        A6 --> A8["A8: radius = &lt;b&gt;"]

        A4 --> A9["A9: sides = 2"]
        A7 --> A10["A10: sides = 1"]
        A7 --> A11["A11: sides = 1"]
        A5 --> A12["A12: sides = 1"]
        A8 --> A13["A13: sides = 1"]
        A8 --> A14["A14: sides = 1"]
        A6 --> A15["A15: sides = 2"]

        A9 --> R1["R1"]
        A10 & A11 --> B1["B1: = &lt;n&gt;"] --> R2["R2"]
        A11 & A12 --> B2["B2: = &lt;n&gt;"]
        A12 & A13 --> B3["B3: = &lt;n&gt;"] --> R5["R5"]
        B2 --> B4["B4: &lt;a&gt; &lt; &lt;b&gt;"] --> R3["R3"]
        B2 --> B5["B5: &lt;a&gt; &gt; &lt;b&gt;"] --> R4["R4"]
        A15 --> R6["R6"]
