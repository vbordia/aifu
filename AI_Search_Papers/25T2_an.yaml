- id: 2
  type: comprehension
  label: TSP BNB
  description: |
    TSP BnB algorithm is solving a TSP instance where the cities are A, B, C, .... and so on. The BnB search tree (at the point when the algorithm discovers the optimal tour) is provided below.

    Each node in the search tree displays an edge (either XY or $\neg$XY), a cost value, and a unique reference number (a1, b1, ..., c1, ..., d1, ..., e1, e2). Use the reference numbers to break ties. When required, use reference numbers in short answers.

    What information can you glean from the search tree? Answer the sub-questions based on the information gleaned from the search tree.

    ```mermaid
    graph TD
        a1["a1: S0 (305)"] --> b1["b1: AC (305)"]
        a1 --> b2["b2: ¬AC (342)"]
        b1 --> c1["c1: BD (305)"]
        b1 --> c2["c2: ¬BD (350)"]
        b2 --> c3["c3: BD (342)"]
        b2 --> c4["c4: ¬BD (387)"]
        c1 --> d1["d1: CD (382)"]
        c1 --> d2["d2: ¬CD (327)"]
        c2 --> d3["d3: CD (500)"]
        c2 --> d4["d4: ¬CD (516)"]
        c3 --> d5["d5: CD (366)"]
        c3 --> d6["d6: ¬CD (382)"]
        d2 --> e1["e1: BC (378)"]
        d2 --> e2["e2: ¬BC (403)"]
    ```
  subquestions:
  - sub_id: '2.1'
    question_type: short_answer
    question: |
      Let S0 (ref. no. a1) be the first node to be refined, identify the next 4 nodes (2nd to 5th node) that are refined by the TSP BnB algorithm. Enter the nodes (node reference numbers) in the order they are refined.

      Enter a comma separated list of node reference numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: a9,b9,c9,d9
    correct_answer: b1,c1,d2,b2
  - sub_id: '2.2'
    question_type: short_answer
    question: |
      Which node represents the optimal tour? Enter the node reference number in the text box, or enter NIL if it is not possible to determine the optimal tour.

      Enter a node reference number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: a9
    correct_answer: d5
  - sub_id: '2.3'
    question_type: short_answer
    question: |
      What is the cost of the optimal tour? Enter the cost of the optimal tour in the text box, or enter NIL if it is not possible to determine the optimal tour.

      Enter an integer.
      NO SPACES, TABS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '366'
  - sub_id: '2.4'
