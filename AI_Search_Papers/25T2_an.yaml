        A5 --> A10["A10: part = blades"]
        A5 --> A12["A12: part = nozzle"]

        A6 --> A11["A11: type = liquid"]
        A6 --> A12
        A6 --> A13["A13: type = solid"]

        A7 --> B1["B1 (= <x>)"]
        A8 --> B1
        B1 --> R1["R1: Windmill"]

        A8 --> R2["R2: Generator"]

        A8 --> B2["B2 (= <x>)"]
