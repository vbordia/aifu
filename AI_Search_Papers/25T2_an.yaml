- id: 6
  type: comprehension
  label: AUTOMATED PLANNING
  description: |
    The domain description of a Blocks World with a single one-armed robot is given below.

    **PREDICATES**
    - `armEmpty`: The arm is not holding any block, it is empty.
    - `holding(X)`: The arm is holding X.
    - `onTable(X)`: X is on the table.
    - `clear(X)`: X has nothing above it, it is clear.
    - `on(X,Y)`: X is directly placed on Y.

    **OPERATORS**

    `Pickup(X)`: pick up X from the table.
    - Preconditions: `{ armEmpty, clear(X), onTable(X) }`
    - Add Effects: `{ holding(X) }`
    - Del Effects: `{ armEmpty, onTable(X) }`

    `Putdown(X)`: place X on the table.
    - Preconditions: `{ holding(X) }`
    - Add Effects: `{ armEmpty, onTable(X) }`
    - Del Effects: `{ holding(X) }`

    `Unstack(X,Y)`: pick up X that is directly sitting on Y.
    - Preconditions: `{ armEmpty, clear(X), on(X,Y) }`
    - Add Effects: `{ clear(Y), holding(X) }`
    - Del Effects: `{ armEmpty, on(X,Y) }`

    `Stack(X,Y)`: place X directly on top of Y.
    - Preconditions: `{ holding(X), clear(Y) }`
    - Add Effects: `{ armEmpty, on(X,Y) }`
    - Del Effects: `{ holding(X), clear(Y) }`

    Consider the following planning problem:

    **Start State**: `{ onTable(A), onTable(B), onTable(C), clear(D), clear(E), clear(C), on(D,A), on(E,B), armEmpty }`
    **Goal Description**: `{ on(B,C), on(A,B) }`

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '6.1'
    question_type: multiple_select
    question: Which of the following are applicable actions in the start state?
    options:
      A: Putdown(D)
      B: Unstack(D,A)
      C: Unstack(E,B)
      D: Pickup(C)
      E: Pickup(A)
      F: Stack(A,B)
      G: Stack(B,C)
    correct_options:
    - B
    - C
    - D
  - sub_id: '6.2'
    question_type: multiple_select
    question: Which of the following are relevant actions in the goal state?
    options:
      A: Putdown(D)
      B: Unstack(D,A)
      C: Unstack(E,B)
      D: Pickup(C)
      E: Pickup(A)
      F: Stack(A,B)
      G: Stack(B,C)
    correct_options:
    - F
    - G
  - sub_id: '6.3'
    question_type: multiple_select
    question: In the planning graph, which of the following are mutex action pairs in Layer 1?
    options:
      A: Unstack(D,A), Pickup(C)
      B: Unstack(D,A), Unstack(E,B)
      C: Pickup(C), Stack(A,B)
      D: Pickup(C), Stack(B,C)
    correct_options:
    - A
    - B
  - sub_id: '6.4'
    question_type: multiple_select
    question: In the planning graph, which of the following are mutex proposition pairs in Layer 1?
    options:
      A: clear(A), holding(E)
      B: clear(A), clear(B)
      C: clear(C), on(D,A)
      D: clear(C), holding(E)
    correct_options:
    - A
    - B
