- id: 8
  type: comprehension
  label: AUTOMATED PLANNING 2
  description: |
    The domain description of a Blocks World with a single one-armed robot is given below.

    **PREDICATES**
    - `armEmpty`: The arm is not holding any block, it is empty.
    - `holding(X)`: The arm is holding X.
    - `onTable(X)`: X is on the table.
    - `clear(X)`: X has nothing above it, it is clear.
    - `on(X,Y)`: X is directly placed on Y.

    **OPERATORS**

    `Pickup(X)`: pick up X from the table.
    - Preconditions: `{ armEmpty, clear(X), onTable(X) }`
    - Add Effects: `{ holding(X) }`
    - Del Effects: `{ armEmpty, onTable(X) }`

    `Putdown(X)`: place X on the table.
    - Preconditions: `{ holding(X) }`
    - Add Effects: `{ armEmpty, onTable(X) }`
    - Del Effects: `{ holding(X) }`

    `Unstack(X,Y)`: pick up X that is directly sitting on Y.
    - Preconditions: `{ armEmpty, clear(X), on(X,Y) }`
    - Add Effects: `{ clear(Y), holding(X) }`
    - Del Effects: `{ armEmpty, on(X,Y) }`

    `Stack(X,Y)`: place X directly on top of Y.
    - Preconditions: `{ holding(X), clear(Y) }`
    - Add Effects: `{ armEmpty, on(X,Y) }`
    - Del Effects: `{ holding(X), clear(Y) }`

    **NOTE**: variables X and Y must bind to different objects.

    Consider the following planning problem.

    **Start State**: `{ onTable(A), onTable(B), on(C,A), on(E,B), clear(C), clear(E), clear(D), holding(D) }`

    **Goal Description**: `{ on(D,E), on(A,D) }`

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '8.1'
    question_type: multiple_select
    question: Which of the following are applicable actions for FSSP?
    options:
      A: Putdown(D)
      B: Stack(A,D)
      C: Stack(D,E)
      D: Stack(D,C)
      E: Unstack(E,B)
      F: Unstack(C,A)
    correct_options:
    - A
    - C
    - D
  - sub_id: '8.2'
    question_type: multiple_select
    question: Which of the following are relevant actions for BSSP?
    options:
      A: Putdown(D)
      B: Stack(A,D)
      C: Stack(D,E)
      D: Stack(D,C)
      E: Unstack(E,B)
      F: Unstack(C,A)
    correct_options:
    - B
    - C
  - sub_id: '8.3'
    question_type: multiple_select
    question: In the planning graph, which of the following are mutex action pairs in layer 1?
    options:
      A: Stack(D,E) and nop for armEmpty
      B: Stack(D,E) and nop for clear(C)
      C: Stack(D,E) and nop for holding(D)
      D: Stack(D,E) and Putdown(D)
    correct_options:
    - C
    - D
  - sub_id: '8.4'
    question_type: multiple_select
    question: In the planning graph, which of the following are mutex proposition pairs in layer 1?
    options:
      A: armEmpty and clear(C)
      B: armEmpty and holding(D)
      C: on(D,E) and clear(C)
      D: on(D,E) and onTable(D)
    correct_options:
    - B
    - D
  - sub_id: '8.5'
    question_type: multiple_select
    question: In the planning graph, which of the following are applicable actions in layer 2?
    options:
      A: Pickup(D)
      B: Putdown(C)
      C: Unstack(E,B)
      D: Unstack(C,A)
    correct_options:
    - A
    - C
    - D
  - sub_id: '8.6'
    question_type: multiple_choice
    question: For the given planning problem, does a plan exist?
    options:
      A: 'Yes'
      B: 'No'
      C: Cannot be determined
    correct_option: A
  - sub_id: '8.7'
    question_type: short_answer
    question: |
      For the given planning problem, the length of the plan found by GraphPlan is __________ .

      Enter an integer or enter NIL if GraphPlan cannot find a plan.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12
    correct_answer: '5'
- id: 9
  type: comprehension
  label: CONSTRAINT SATISFACTION
  description: |
    Consider a CSP over 3 variables A, B, C where the domains and constraints are:

    $$D_A = D_B = D_C = \{1,2,3,4\}$$
    $$R_{AC}: A = \text{mod}(2C, 3)$$
    $$R_{BA}: B = \text{mod}(2A, 7)$$
    $$R_{CB}: C = \text{mod}(2B, 7)$$

    where, $\text{mod}(n,d)$ returns the remainder after dividing $n$ by $d$, for example, $\text{mod}(8,3)=2$, $\text{mod}(6,7)=6$, $\text{mod}(8,7)=1$.

    Compute the three relations to match the domain constraints, then draw the constraint graph and matching-diagram, and then answer the sub-questions.
  subquestions:
  - sub_id: '9.1'
    question_type: multiple_select
    question: Which of the following tuples occur in R_AC?
    options:
      A: (1,2)
      B: (2,1)
      C: (2,4)
      D: (4,2)
    correct_options:
    - A
    - B
    - C
  - sub_id: '9.2'
    question_type: multiple_select
    question: Which of the following tuples occur in R_BA?
    options:
      A: (1,4)
      B: (2,1)
      C: (3,1)
      D: (4,2)
    correct_options:
    - A
    - B
    - D
  - sub_id: '9.3'
    question_type: multiple_choice
    question: Is the given CSP arc-consistent?
    options:
      A: 'Yes'
      B: 'No'
      C: Cannot be determined
    correct_option: B
  - sub_id: '9.4'
    question_type: multiple_choice
    question: If the given CSP is not already arc-consistent, then make it arc-consistent, and then check if the resulting network is path consistent.
    options:
      A: It is path consistent.
      B: It is not path consistent.
      C: Path consistency does not apply because the constraint graph has a cycle.
    correct_option: A
  - sub_id: '9.5'
    question_type: short_answer
    question: |
      Does the given CSP have a solution?

      Enter the solution for the variables A,B,C as a comma separated list.
      Enter NIL if there is no solution.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 1,2,3
    correct_answer: 2,4,1
