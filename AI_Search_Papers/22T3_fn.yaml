- id: 9
  type: comprehension
  label: PROBLEM DECOMPOSITION
  description: |
    The figure shows an AND-OR graph that depicts how a problem S can be decomposed and transformed into one or more simpler problems. Nodes are uniquely identified by labels (S, A, B, …). The number in each node is the heuristic estimate of the cost of solving that node.

    Nodes with double lines are primitive nodes and their values are actual costs. Observe that a primitive node is added to the graph by its parent when the parent is expanded, and the primitive node is labeled as SOLVED and it will not be expanded subsequently.

    ```mermaid
    graph TD
        S["S: 100"] --- A["A: 80"]
        S --- B["B: 40"]
        S --- C["C: 200"]
        S --- D["D: 100"]
        S --- E["E: 120"]

        B --- F[["F (primitive): 100"]]
        C --- G[["G (primitive): 50"]]
        C --- H["H: 150"]
        D --- H
        D --- I[["I (primitive): 200"]]
        E --- I
    ```

    **Tie-breaker 1**: For nodes with the same cost, expand in the ascending order of node labels.
    **Tie-breaker 2**: For AND nodes, expand the unsolved branch with the highest cost.

    The cost of each edge is 10. Solve for S, then answer the given subquestions.
  subquestions:
  - sub_id: '9.1'
    question_type: short_answer
    question: |
      List the first three nodes (including S) expanded by AO* algorithm. List the nodes in the order they are expanded. Observe that primitive nodes are not expanded.

      Enter a comma separated list of node labels.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: X,Y,Z
    correct_answer: S,D,E
  - sub_id: '9.2'
    question_type: short_answer
    question: |
      Determine the value of the start node S after each node expansion. List the first three values of S that correspond to the first three node expansions.

      Enter a comma separated list of numbers.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 12,42,17
    correct_answer: 110,130,140
  - sub_id: '9.3'
    question_type: short_answer
    question: |
      What is the final value of the start node S?

      Enter a number.
      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 42
    correct_answer: '190'
  - sub_id: '9.4'
    question_type: multiple_choice
    question: In the given AND-OR graph, is the heuristic admissible?
    options:
      A: 'Yes'
      B: 'No'
      C: Cannot be determined
    correct_option: A
