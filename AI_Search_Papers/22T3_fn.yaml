- id: 7
  type: comprehension
  label: GAMES
  description: |
    The figure shows a 4-ply game tree with evaluation function values at the horizon. The nodes in the horizon are assigned labels A,B,C,...,P. Use these labels when asked to enter a horizon node or a list of horizon nodes.

    **Tie-breaker**: when several nodes qualify then select the left most node, if tie persists then select the deepest node among the left most nodes.

    ```mermaid
    graph TD
        R["Root (MAX)"]
        N1["MIN"] --- R
        N2["MIN"] --- R

        M1["MAX"] --- N1
        M2["MAX"] --- N1
        M3["MAX"] --- N2
        M4["MAX"] --- N2

        C1["MIN"] --- M1
        C2["MIN"] --- M1
        C3["MIN"] --- M2
        C4["MIN"] --- M2
        C5["MIN"] --- M3
        C6["MIN"] --- M3
        C7["MIN"] --- M4
        C8["MIN"] --- M4

        A["A: 99"] --- C1
        B["B: 49"] --- C1
        C["C: 21"] --- C2
        D["D: 62"] --- C2
        E["E: 88"] --- C3
        F["F: 86"] --- C3
        G["G: 23"] --- C4
        H["H: 83"] --- C4
        I["I: 14"] --- C5
        J["J: 75"] --- C5
        K["K: 19"] --- C6
        L["L: 13"] --- C6
        M["M: 17"] --- C7
        N["N: 48"] --- C7
        O["O: 80"] --- C8
        P["P: 82"] --- C8
    ```

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '7.1'
