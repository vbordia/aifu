subject: 'DEGREE LEVEL: AI: SEARCH METHODS FOR PROBLEM SOLVING'
questions:
- id: 1
  type: comprehension
  label: SEARCH
  description: |
    Consider a 5-3-2 water jug puzzle with three jugs a, b, c of capacity 5L, 3L, 2L, respectively. A state is represented as a three digit string ABC, where A, B, C denote the volume of water present in the jugs a, b, c, respectively. For example, 302 denotes a state where jug a has 3 liters of water, jug b is empty and jug c has 2 liters of water.

    Two types of moves (state transitions) are allowed:
    - `xEy`: pick up jug x and empty it into jug y,
    - `xFy`: pick up jug x and fill up (top up) jug y.

    So the possible moves are: `aEb`, `aEc`, `aFb`, `aFc`, `bEa`, `bEc`, `bFa`, `bFc`, `cEa`, `cEb`, `cFa`, `cFb`.

    **Tie-breaker**: in some states, both `xEy` and `xFy` may produce the same output state, in such cases, choose `xEy` to break the tie. For example, from the 302 state, both `aEb` and `aFb` produce the same output state 032, therefore, to break the tie choose `aEb` as the move.

    For the 5-3-2 water jug puzzle, the `MoveGen` function takes a state ABC and returns a set of states that can be produced in one move. For example, `MoveGen(500)` returns { 230, 302 }.

    Based on the above data, answer the given subquestions.
  subquestions:
  - sub_id: '1.1'
    question_type: short_answer
    question: |
      Let 500 be the start state and 131 be the goal state, find the shortest path from start to goal. Enter the path starting with 500 as a comma separated list of states.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: 500,411,747
    correct_answer: 500,302,320,122,131
  - sub_id: '1.2'
    question_type: short_answer
    question: |
      Let 500 be the start state and 131 be the goal state, find the sequence of moves that produce the shortest path from start to goal. Enter the sequence of moves as a comma separated list.

      NO SPACES, TABS, DOTS, BRACKETS OR EXTRANEOUS CHARACTERS.
      Answer format: aFb,bFc,cEa
    correct_answer: aFc,cEb,aFc,cFb
- id: 2
  type: multiple_choice
  label: SEARCH FOR OPTIMAL SOLUTION
  question: Which of the following variants of Depth First Iterative Deepening (DFID) is guaranteed to find an optimal solution?
  options:
    A: DFID that inspects only new nodes
    B: DFID that inspects new as well as open nodes
    C: DFID that inspects new as well as closed nodes
    D: None of these
  correct_option: C
- id: 3
  type: multiple_choice
  label: SEARCH FOR OPTIMAL SOLUTION
  question: Given a state space (and a search space) that is too large to fit into main memory, and with Euclidean edge costs, and with the best admissible heuristics, which of the following algorithms will you choose to find an optimal path?
  options:
    A: Depth First Search
    B: Breadth First Search
    C: Dijkstra's algorithm
    D: Branch and Bound Search
    E: A*
    F: WA* for some w
    G: Sparse Memory Graph Search (SMGS)
  correct_option: G
