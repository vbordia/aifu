  type: multiple_choice
  label: SEARCH FOR OPTIMAL SOLUTION
  question: |
    In the map, nodes are placed on a grid where each tile is 10x10 in size, is the Manhattan distance heuristic admissible?

    ```mermaid
    graph TD
        S((S)) ---|6| A((A))
        S ---|6| B((B))
        S ---|14| C((C))
        A ---|6| C
        B ---|6| C
        B ---|6| D((D))
        B ---|14| G((G))
        C ---|6| G
        D ---|6| G
    ```
  options:
    A: 'No'
    B: 'yes'
    C: Cannot be determined
  correct_option: A
